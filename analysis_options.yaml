include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Paket pihak ketiga (fl_chart, table_calendar, go_router) masih memakai
    # package:flutter/material.dart pada Flutter 3.47+. Abaikan info ini agar
    # flutter analyze tetap berfokus pada error/warning kode aplikasi.
    deprecated_member_use: ignore

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_print: true
    use_super_parameters: true
