name: Build APK Android

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Sinkronisasi Gradle Wrapper & Mipmap jika Belum Ada
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || [ ! -d android/app/src/main/res/mipmap-hdpi ]; then
            flutter create --platforms=android --org com.jagabersama --project-name jaga_bersama /tmp/fl_tpl
            mkdir -p android/gradle/wrapper
            cp -f /tmp/fl_tpl/android/gradlew android/gradlew
            cp -f /tmp/fl_tpl/android/gradlew.bat android/gradlew.bat
            chmod +x android/gradlew
            cp -f /tmp/fl_tpl/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
            cp -rn /tmp/fl_tpl/android/app/src/main/res/mipmap-* android/app/src/main/res/ || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze --no-fatal-infos

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          if [ ! -f build/app/outputs/apk/release/app-release.apk ] && [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            mkdir -p build/app/outputs/apk/release
            cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/apk/release/app-release.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-android-apk
          path: build/app/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Buat GitHub Release Otomatis
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/apk/release/app-release.apk
          generate_release_notes: true
