name: jaga_bersama
description: Aplikasi Android Family Health Monitoring and Management System berbasis Flutter & Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.13.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  fl_chart: ^0.69.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  table_calendar: ^3.1.2
  image_picker: ^1.1.2
  file_picker: ^10.1.0
  flutter_image_compress: ^2.3.0
  intl: '>=0.19.0 <0.21.0'
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
